spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS PAYMENT_SERVICE_UAT
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: true
    schemas: PAYMENT_SERVICE_UAT
    default-schema: PAYMENT_SERVICE_UAT

  jpa:
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: always