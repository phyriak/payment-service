server:
  port: 8082
  tomcat:
    threads:
      max: 200 # Max number of threads
      min-spare: 5 # Min threads waiting when there is no requests, then 5->10->15->20

    accept-count: 100 # Max request queue when all threads are occupied. If 101 request than -> timeout

    max-connections: 200 # Max number of TCP connections which Tomcat will receive.
    #Not all will be executed by Threads, some of them keep open connections - Keep-Alive. max-connections > maxThreads

    mbeanregistry:
      enabled: true # Activate JMX MBEans for Tomcat for monitoring: Current threads, Busy Threads, Request Count

spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ecommerce?currentSchema=${DB_SCHEMA}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10 # Number of connections to db, if 11 requests than 1 is waiting
      minimum-idle: 5 # Min ready connections
      connection-timeout: 3000 # Max request waiting time for a db connection. If there is no connection after 3s -> SQLTransientConnectionException
      # Reaching timeout means slow query, small pool, long transactions
      idle-timeout: 600000 # If connections are not used after X min, Hikari can close it if reach idle-timeout
      max-lifetime: 1800000 # Hikari close old connection


  resilience4j:
    circuitbreaker:
      instances:
        database:
          slidingWindowSize: 20
          failureRateThreshold: 50
          waitDurationInOpenState: 10s
          minimumNumberOfCalls: 10
          ignoreExceptions:
            - com.example.exception.PaymentNotFoundException
            - io.github.resilience4j.bulkhead.BulkheadFullException
            - com.phyriak.exceptions.ServiceOverloadedException
    bulkhead:
      instances:
        database:
          maxConcurrentCalls: 10
          maxWaitDuration: 0ms

  jpa:
    show-sql: false
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: ${DB_SCHEMA}
        jdbc.batch_size: 1000
        order_inserts: true
        order_updates: true

    database-platform: org.hibernate.dialect.PostgreSQLDialect


  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db/changelog-master.yaml
    default-schema: ${DB_SCHEMA}
    liquibase-schema: ${DB_SCHEMA}

  batch:
    jdbc:
      initialize-schema: always

    job:
      enabled: false

  kafka:
    bootstrap-servers: kafka:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include:
          - info
          - health
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4320/v1/traces}

  prometheus:
    metrics:
      export:
        enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

      percentiles:
        http.server.requests: 0.5,0.95,0.99

    tags:
      application: payment-service

logging:
  level:
    org.hibernate.SQL: ERROR
  file:
    name: logs/payment-service.log

springdoc:
  show-actuator: true