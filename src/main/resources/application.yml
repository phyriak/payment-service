server:
  port: 8080


spring:
  application:
    name: payment-service


  datasource:
    url: jdbc:h2:mem:mydb;INIT=CREATE SCHEMA IF NOT EXISTS BASE
    username: sa
    password:
    driver-class-name: org.h2.Driver


  h2:
   console:
      enabled: true
      path: /h2-console



  jpa:
    properties:
      hibernate:
        default_schema: BASE
        jdbc.batch_size: 1000
        order_inserts: true
        generate_statistics: true

        ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect


  batch:
    jdbc:
      initialize-schema: always

    job:
      enabled: false



management:
  endpoints:
    web:
      exposure:
        include: info, health, prometheus

  endpoint:
    health:
      probes:
        enabled: true

  tracing:
    sampling:
     probability: 1.0

  otlp:
     tracing:
      endpoint: http://localhost:4320/v1/traces
  ## 4318 for http, 4317 for grpc

  prometheus:
    metrics:
       export:
         enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

    tags:
      application: payment-service


logging:
  file:
    name: logs/payment-service.log

    pattern:
      correlation: "[%X{traceId:-},%X{spanId:-}] "

springdoc:
  show-actuator: true

##http://localhost:8080/swagger-ui.html
