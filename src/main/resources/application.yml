server:
  port: 8082

spring:
  application:
    name: payment-service
  jpa:
    properties:
      hibernate:
        jdbc.batch_size: 1000
        order_inserts: true
        order_updates: true
        generate_statistics: false
        format_sql: false

  batch:
    jdbc:
      initialize-schema: always

    job:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: info, health, prometheus, metrics

  endpoint:
    health:
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4320/v1/traces}

  prometheus:
    metrics:
      export:
        enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

    tags:
      application: payment-service

logging:
  file:
    name: logs/payment-service.log

    pattern:
      correlation: "[%X{traceId:-},%X{spanId:-}] "

springdoc:
  show-actuator: true

##http://localhost:8080/swagger-ui.html
