server:
  port: 8082

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:h2:mem:paymentdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS payment_service_local
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: false
    open-in-view: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        default_schema: payment_service_local

    database-platform: org.hibernate.dialect.H2Dialect

  batch:
    jdbc:
      initialize-schema: always

    job:
      enabled: false


  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db/changelog-master.yaml
    default-schema: ${DB_SCHEMA}
    liquibase-schema: ${DB_SCHEMA}

management:
  endpoints:
    web:
      exposure:
        include: info,health,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://localhost:4320/v1/traces

  prometheus:
    metrics:
      export:
        enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

      percentiles:
        http.server.requests: 0.5,0.95,0.99

    tags:
      application: payment-service

logging:
  file:
    name: logs/payment-service.log

  level:
    org.hibernate.SQL: INFO
    org.hibernate.tool.schema: INFO

springdoc:
  show-actuator: true