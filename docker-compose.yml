services:

  payment-service:
    container_name: payment-service
    image: payment-service:latest

    ports:
      - "8082:8082"
      - "9404:9404"
  

    environment:
      APP_ENV: uat
      SPRING_PROFILES_ACTIVE: uat
      DB_URL: jdbc:postgresql://postgres-db:5432/ecommerce?currentSchema=payment_service_uat
      DB_USERNAME: payment_user
      DB_PASSWORD: uat-payment-password
      DB_SCHEMA: payment_service_uat

      OTEL_ENDPOINT: http://otel-collector:4318/v1/traces

      TZ: Europe/Warsaw
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Warsaw"

    restart: unless-stopped

    networks:
      - ecommerce-network


networks:
  ecommerce-network:
    external: true
    name: ecommerce-platform_ecommerce-network

