services:

  payment-service:
    container_name: payment-service
    image: phyriak/payment-service:latest

    ports:
      - "8082:8082"
  
    

    environment:
      APP_ENV: uat
      SPRING_PROFILES_ACTIVE: uat
      DB_URL: jdbc:postgresql://postgres:5432/payment
      OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
      DB_USERNAME: payment_user
      DB_PASSWORD: uat-payment-password
      DB_SCHEMA: payment_service_uat
      TZ: Europe/Warsaw
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Warsaw"

    restart: unless-stopped
    
    depends_on:
     - postgres
     - otel-collector

    

  postgres:
    image: postgres:16

    container_name: postgres-db

    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: uat-payment-password

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus

    
    restart: unless-stopped
  

  grafana:
    image: grafana/grafana
    container_name: grafana

    ports:
      - "3000:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

    volumes:
      - grafana-storage:/var/lib/grafana

    depends_on:
      - prometheus
      - tempo
      - loki

    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: tempo

    command:
      - "-config.file=/etc/tempo.yml"

    volumes:
      - ./tempo.yml:/etc/tempo.yml
      - tempo-storage:/var/tempo

    ports:
      - "3200:3200"

    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector

    command:
      - "--config=/etc/otel-collector-config.yml"

    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml

    ports:
      - "4320:4318"

    depends_on:
      - tempo

    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    ports:
      - "3100:3100"

    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki-storage:/loki

    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail

    command:
      - "-config.file=/etc/promtail/config.yml"

    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/payment-service

    depends_on:
      - loki

    restart: unless-stopped

volumes:
  postgres-data:
  grafana-storage:
  prometheus-storage:
  loki-storage:
  tempo-storage: